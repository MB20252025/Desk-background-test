<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image Layout</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* ---------- Stage: the background ---------- */
  .stage {
    --ar: 1.7778;                 /* aspect ratio, updated from T7.png */
    position: relative;
    width: min(100vw, calc(100vh * var(--ar)));
    aspect-ratio: var(--ar);
    background: #222 center / 100% 100% no-repeat;
    overflow: hidden;
  }

  /* ---------- Layer: holds all 6 images (moves/scales as a group) ---------- */
  .layer {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;    /* scale from centre of the background */
    will-change: transform;
  }

  /* ---------- Individual image ---------- */
  .item {
    position: absolute;
    left: calc(var(--x) * 1%);    /* centre of image, % of stage width  */
    top:  calc(var(--y) * 1%);    /* centre of image, % of stage height */
    width: calc(var(--w) * 1%);   /* width, % of stage width            */
    height: auto;
    transform: translate(-50%, -50%)
               rotate(calc(var(--r) * 1deg))
               scale(var(--s));
    transform-origin: 50% 50%;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ---------- Control panel (optional – delete if you don't want it) ---------- */
  .panel {
    position: fixed;
    left: 16px; bottom: 16px;
    padding: 12px 14px;
    background: rgba(20,20,24,.88);
    border: 1px solid #333;
    border-radius: 10px;
    color: #e8e8ea;
    font-size: 12px;
    backdrop-filter: blur(6px);
    display: grid;
    gap: 8px;
    width: 260px;
  }
  .panel .row { display: grid; grid-template-columns: 88px 1fr 46px; gap: 8px; align-items: center; }
  .panel output { text-align: right; color: #9aa0ff; font-variant-numeric: tabular-nums; }
  .panel input[type=range] { width: 100%; accent-color: #6c7bff; }
  .panel .btns { display: flex; gap: 8px; }
  .panel button {
    flex: 1; padding: 6px 8px; cursor: pointer;
    background: #2a2a33; color: #e8e8ea;
    border: 1px solid #3a3a45; border-radius: 6px; font-size: 12px;
  }
  .panel button:hover { background: #34343f; }
</style>
</head>
<body>

  <div class="stage">
    <div class="layer" id="layer"></div>
  </div>

  <!-- Optional live controls -->
  <div class="panel">
    <div class="row"><label>All — X</label><input id="gx" type="range" min="-100" max="100" step="0.5"><output id="gxOut"></output></div>
    <div class="row"><label>All — Y</label><input id="gy" type="range" min="-100" max="100" step="0.5"><output id="gyOut"></output></div>
    <div class="row"><label>All — Scale</label><input id="gs" type="range" min="0.1" max="3" step="0.01"><output id="gsOut"></output></div>
    <div class="btns">
      <button id="resetBtn">Reset</button>
      <button id="copyBtn">Copy values</button>
    </div>
  </div>

<script>
/* ============================================================
   EDIT EVERYTHING HERE
   ------------------------------------------------------------
   global.x      → moves ALL images left/right  (% of stage width,  + = right)
   global.y      → moves ALL images up/down     (% of stage height, + = down)
   global.scale  → scales ALL images            (1 = 100%)

   images[].x    → centre of that image, % of stage width   (0 = left, 100 = right)
   images[].y    → centre of that image, % of stage height  (0 = top,  100 = bottom)
   images[].w    → width of that image, % of stage width
   images[].scale / rotation → per-image tweaks
   ============================================================ */
const CONFIG = {
  background: 'T7.png',

  global: {
    x: 0,
    y: 0,
    scale: 1
  },

  images: [
    { file: 'T1.png', x: 25, y: 30, w: 15, scale: 1, rotation: 0 },
    { file: 'T2.png', x: 50, y: 30, w: 15, scale: 1, rotation: 0 },
    { file: 'T3.png', x: 75, y: 30, w: 15, scale: 1, rotation: 0 },
    { file: 'T4.png', x: 25, y: 70, w: 15, scale: 1, rotation: 0 },
    { file: 'T5.png', x: 50, y: 70, w: 15, scale: 1, rotation: 0 },
    { file: 'T6.png', x: 75, y: 70, w: 15, scale: 1, rotation: 0 }
  ]
};
/* ========================= END OF CONFIG ==================== */


const stage = document.querySelector('.stage');
const layer = document.getElementById('layer');

/* --- Background + stage aspect ratio taken from the background image --- */
stage.style.backgroundImage = `url("${CONFIG.background}")`;
const bgProbe = new Image();
bgProbe.onload = () => {
  const ar = bgProbe.naturalWidth / bgProbe.naturalHeight;
  stage.style.setProperty('--ar', ar);
};
bgProbe.src = CONFIG.background;

/* --- Build the 6 images --- */
CONFIG.images.forEach(cfg => {
  const img = document.createElement('img');
  img.className = 'item';
  img.src = cfg.file;
  img.alt = '';
  img.draggable = false;
  img.style.setProperty('--x', cfg.x);
  img.style.setProperty('--y', cfg.y);
  img.style.setProperty('--w', cfg.w);
  img.style.setProperty('--s', cfg.scale ?? 1);
  img.style.setProperty('--r', cfg.rotation ?? 0);
  layer.appendChild(img);
});

/* --- Apply the global transform --- */
function applyGlobal() {
  const g = CONFIG.global;
  layer.style.transform = `translate(${g.x}%, ${g.y}%) scale(${g.scale})`;
}
applyGlobal();


/* ============================================================
   Optional slider panel – remove this block if you don't need it
   ============================================================ */
const gx = document.getElementById('gx');
const gy = document.getElementById('gy');
const gs = document.getElementById('gs');
const gxOut = document.getElementById('gxOut');
const gyOut = document.getElementById('gyOut');
const gsOut = document.getElementById('gsOut');

const DEFAULTS = { ...CONFIG.global };

function syncFromSliders() {
  CONFIG.global.x = parseFloat(gx.value);
  CONFIG.global.y = parseFloat(gy.value);
  CONFIG.global.scale = parseFloat(gs.value);
  gxOut.textContent = CONFIG.global.x + '%';
  gyOut.textContent = CONFIG.global.y + '%';
  gsOut.textContent = CONFIG.global.scale.toFixed(2) + '×';
  applyGlobal();
}

function syncToSliders() {
  gx.value = CONFIG.global.x;
  gy.value = CONFIG.global.y;
  gs.value = CONFIG.global.scale;
  syncFromSliders();
}

[gx, gy, gs].forEach(el => el.addEventListener('input', syncFromSliders));

document.getElementById('resetBtn').addEventListener('click', () => {
  Object.assign(CONFIG.global, DEFAULTS);
  syncToSliders();
});

document.getElementById('copyBtn').addEventListener('click', async () => {
  const txt = `global: { x: ${CONFIG.global.x}, y: ${CONFIG.global.y}, scale: ${CONFIG.global.scale} },`;
  try {
    await navigator.clipboard.writeText(txt);
    copyBtn.textContent = 'Copied!';
    setTimeout(() => copyBtn.textContent = 'Copy values', 1200);
  } catch (e) {
    alert(txt);
  }
});

syncToSliders();
</script>
</body>
</html>
